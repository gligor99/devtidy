[[rule]]
id = "xcode.derived-data"
name = "Xcode DerivedData"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/Xcode/DerivedData"]
safety = "safe"
regen_cost = "medium"
description = "Build products, intermediates and indexes for every project Xcode has ever built."
regen_note = "The next build of each project re-indexes and compiles from scratch."
cleanup = { kind = "remove", contents_only = true }
processes = ["Xcode"]
docs = "https://developer.apple.com/documentation/xcode/build-system"

[[rule]]
id = "xcode.archives"
name = "Xcode Archives"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/Xcode/Archives/*"]
safety = "dangerous"
regen_cost = "high"
description = "Archived app builds, including the dSYM files needed to symbolicate crash reports from shipped versions."
regen_note = "Cannot be regenerated. Without the dSYMs, crash reports for that release stay unsymbolicated."
cleanup = { kind = "remove" }

[[rule]]
id = "xcode.device-support"
name = "Xcode device support files"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/Xcode/*DeviceSupport/*"]
safety = "caution"
regen_cost = "medium"
description = "Debug symbols copied from every physical device and OS version you have connected."
regen_note = "Copied again the next time that device is connected, which can take several minutes."
cleanup = { kind = "remove" }
processes = ["Xcode"]

[[rule]]
id = "xcode.previews"
name = "SwiftUI Previews cache"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/Xcode/UserData/Previews"]
safety = "safe"
regen_cost = "low"
description = "Simulator data and builds used by SwiftUI Previews."
regen_note = "Recreated the next time a preview is shown."
cleanup = { kind = "remove", contents_only = true }
processes = ["Xcode"]

[[rule]]
id = "simulator.caches"
name = "Simulator caches"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/CoreSimulator/Caches"]
safety = "safe"
regen_cost = "low"
description = "Dyld and runtime caches generated by CoreSimulator."
regen_note = "Regenerated automatically; the first simulator boot is slower."
cleanup = { kind = "remove", contents_only = true }
processes = ["Simulator"]

[[rule]]
id = "simulator.devices"
name = "Simulator devices"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Developer/CoreSimulator/Devices"]
safety = "dangerous"
regen_cost = "high"
description = "Every simulator device with its installed apps, data and settings."
regen_note = "Devices must be recreated in Xcode and all app data inside them is lost."
cleanup = { kind = "command", argv = ["xcrun", "simctl", "delete", "all"] }
processes = ["Simulator"]

[[rule]]
id = "cocoapods.cache"
name = "CocoaPods cache"
ecosystem = "ios"
platforms = ["macos"]
paths = ["~/Library/Caches/CocoaPods"]
safety = "safe"
regen_cost = "medium"
description = "Downloaded pod sources and specs shared by all projects."
regen_note = "The next `pod install` downloads pods again."
cleanup = { kind = "command", argv = ["pod", "cache", "clean", "--all"], fallback_remove = true }
docs = "https://guides.cocoapods.org/terminal/commands.html#pod_cache_clean"
