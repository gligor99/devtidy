name: Website

# Builds the landing page and docs (Astro + Starlight) and deploys them to
# GitHub Pages. The site reads rules, CHANGELOG.md and the app version from
# the repository, so it rebuilds whenever any of them change.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - crates/rules/rules/**
      - CHANGELOG.md
      - app/package.json
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - crates/rules/rules/**
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          # Astro needs a newer 22.x than runners may have cached.
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
