<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DevTidy app icon. Source of truth: regenerate PNGs with `pnpm tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D3B4"/>
      <stop offset="0.55" stop-color="#119C86"/>
      <stop offset="1" stop-color="#0B5F55"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7D6"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#062E29" flood-opacity="0.35"/>
    </filter>
    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#053B34" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle-ish tile with the standard 100px margin -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  </g>

  <g filter="url(#glyph-shadow)">
    <!-- { } -->
    <g fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 426 330 C 356 330 352 368 352 424 L 352 462 C 352 496 336 512 296 512 C 336 512 352 528 352 562 L 352 600 C 352 656 356 694 426 694"/>
      <path d="M 598 330 C 668 330 672 368 672 424 L 672 462 C 672 496 688 512 728 512 C 688 512 672 528 672 562 L 672 600 C 672 656 668 694 598 694"/>
    </g>
    <!-- sparkle -->
    <path fill="url(#spark)" d="M 512 400 Q 523 501 614 512 Q 523 523 512 624 Q 501 523 410 512 Q 501 501 512 400 Z"/>
    <path fill="#FFFFFF" opacity="0.9" d="M 590 372 Q 594 404 622 408 Q 594 412 590 444 Q 586 412 558 408 Q 586 404 590 372 Z"/>
  </g>
</svg>
