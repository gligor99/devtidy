[package]
name = "devtidy-core"
description = "Scanner, size measurement and cleanup engine for devtidy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fs4 = "1.1.0"
glob = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
specta-typescript = { version = "=0.0.13", optional = true }
thiserror = "2.0.21"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
specta = ["dep:specta", "dep:specta-typescript"]
specta-typescript = ["dep:specta-typescript"]
