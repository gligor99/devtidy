[package]
name = "devtidy-app"
description = "DevTidy desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "devtidy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
devtidy-core = { version = "0.2.0", path = "../../crates/core", features = ["specta"] }
devtidy-rules = { version = "0.2.0", path = "../../crates/rules" }
devtidy-store = { version = "0.2.0", path = "../../crates/store", features = ["specta"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
